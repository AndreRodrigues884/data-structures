name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint:check
      - run: npm run format:check
      - run: npm run type-check
      - run: npm test
      - run: npm run build-only

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # cada ficheiro termina com exemplos em forma de assert
      - name: Run Python examples
        run: |
          for f in src/lib/structures/python/*.py; do
            echo "▶ $f"
            python "$f"
          done
